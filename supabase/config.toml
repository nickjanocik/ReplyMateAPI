project_id = "replymate-api"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3001/**", "http://127.0.0.1:3001/**", "http://127.0.0.1:4173/**", "http://localhost:4173/**", "http://localhost:3737/**", "http://127.0.0.1:3737/**"]
enable_signup = true

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.v1-projects]
verify_jwt = true

[functions.v1-context]
verify_jwt = true

[functions.v1-upload]
verify_jwt = true

[functions.v1-chat]
verify_jwt = true

[functions.v1-account]
verify_jwt = true

[functions.v1-outreach]
verify_jwt = true

[functions.v1-billing-webhook]
verify_jwt = false

[functions.v1-twilio-webhook]
verify_jwt = false

# Called by a customer's Google Apps Script trigger, which has no Supabase
# session. Authentication is the per-project token in X-ReplyMate-Token,
# checked inside the function.
[functions.v1-form-intake]
verify_jwt = false
